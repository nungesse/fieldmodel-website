name: Import approved FieldModel assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-fieldmodel-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download approved assets
        run: |
          set -euo pipefail
          mkdir -p assets brand
          VISUAL_URL="$(curl -fsSL https://light-drip-4m4a6eb.shipstatic.com/visual-url.txt)"
          WORDMARK_URL="$(curl -fsSL https://light-drip-4m4a6eb.shipstatic.com/wordmark-url.txt)"
          curl --fail --location --retry 3 "$VISUAL_URL" --output assets/visual-aid-collateral.png
          curl --fail --location --retry 3 "$WORDMARK_URL" --output brand/fieldmodel-wordmark.png
          test -s assets/visual-aid-collateral.png
          test -s brand/fieldmodel-wordmark.png
      - name: Commit assets
        run: |
          git config user.name 'FieldModel Website Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/visual-aid-collateral.png brand/fieldmodel-wordmark.png
          git commit -m 'Add approved FieldModel visual and brand assets' || exit 0
          git push origin main
